<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>English ↔ Tagalog Translator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    justify-content: center;
    padding: 50px 20px;
    color: #00ffea;
}
.translator-card {
    background: #121212;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,255,234,0.3), 0 0 80px rgba(0,255,234,0.1);
    width: 100%;
    max-width: 850px;
    border: 1px solid #00ffea;
}
h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #00ffea;
    font-size: 2rem;
    text-shadow: 0 0 5px #00ffea;
}
.translator-container {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}
.box-container {
    display: flex;
    flex-direction: column;
    width: 100%;
}
label {
    font-weight: 600;
    margin-bottom: 8px;
    color: #00ffd5;
    font-size: 0.95rem;
}
textarea {
    width: 100%;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #00ffea;
    background: #1c1c1c;
    color: #00ffd5;
    resize: none;
    font-size: 1rem;
    transition: border-color 0.3s, box-shadow 0.3s;
}
textarea:focus { 
    border-color: #00fff0; 
    box-shadow: 0 0 15px rgba(0,255,234,0.5);
    outline: none; 
}
.counter {
    text-align: right;
    font-size: 0.85rem;
    color: #00ffea;
    margin-top: 5px;
}
button, select {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s ease-in-out;
    font-family: 'Orbitron', sans-serif;
}
button:disabled { background-color: #555; cursor: not-allowed; color: #aaa; }
button:hover:enabled {
    transform: translateY(-2px);
    box-shadow: 0 0 15px #00ffea, 0 0 30px #00ffea;
}
#translateBtn { background-color: #00ffea; color: #121212; }
#swapBtn { background-color: #0ff; color: #121212; margin: 0 10px; }
#copyBtn { background-color: #00d9ff; color: #121212; }
#clearBtn { background-color: #ff1744; color: #fff; }
#controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 25px;
}
#voiceSelect { display: inline-block; background: #1c1c1c; color: #00ffea; border: 1px solid #00ffea; border-radius: 12px; padding: 8px; }
#speakBtn { display: inline-block; background-color: #00ffea; color: #121212; }
.wave { display: none; align-items: center; gap: 5px; height: 24px; }
.bar { width: 4px; height: 10px; background-color: #00ffea; animation: wave 1s infinite ease-in-out; }
.bar:nth-child(1){animation-delay:0s;} 
.bar:nth-child(2){animation-delay:0.1s;}
.bar:nth-child(3){animation-delay:0.2s;} 
.bar:nth-child(4){animation-delay:0.3s;}
.bar:nth-child(5){animation-delay:0.4s;}
@keyframes wave{0%,100%{transform:scaleY(0.4);}50%{transform:scaleY(1.4);}}
#outputText {
    width: 100%;
    min-height: 160px;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #00ffea;
    background: #1c1c1c;
    color: #00ffd5;
    font-weight: 500;
    font-size: 1rem;
}
@media (max-width:720px){
    .translator-container {flex-direction: column;}
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="translator-card">
    <h2>🌐 English ↔ Tagalog Translator</h2>
    <div style="text-align:center; margin-bottom:20px;">
        <select id="modeSelect" style="background:#1c1c1c; color:#00ffea; border:1px solid #00ffea; border-radius:10px; padding:8px 15px; font-family:'Orbitron';">
          <option value="text">📝 Text Mode</option>
          <option value="image">🖼️ Image Mode</option>
        </select>
      </div>
      <div id="textMode">          
    <div class="translator-container">
        <div class="box-container">
            <label id="inputLabel">English</label>
            <textarea id="inputText" rows="8" placeholder="Type text here..."></textarea>
            <div class="counter" id="charCounter">0 characters</div>
        </div>
        <div class="box-container">
            <label id="outputLabel">Tagalog</label>
            <textarea id="outputText" rows="8" readonly placeholder="Translation appears here..."></textarea>
        </div>
    </div>

    <div style="display:flex; justify-content:center; align-items:center; margin-bottom:20px;">
        <button id="swapBtn">🔄 Swap</button>
    </div>

    <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:15px;">
        <select id="direction" style="display:none;">
            <option value="en-tl">English → Tagalog</option>
            <option value="tl-en">Tagalog → English</option>
        </select>
        <button id="translateBtn" disabled>Translate</button>
        <button id="copyBtn">📋 Copy Output</button>
        <button id="clearBtn">🧹 Clear All</button>
        <button id="defineBtn" disabled>📘 Show Definition</button>
    </div>

    <div id="controls">
        <select id="voiceSelect" style="display:none;"></select>
        <button id="speakBtn" style="display:none;">🔊 Speak</button>
        <div class="wave" id="wave">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
    </div> 
    <div id="definitionBox" 
    style="margin-top: 15px; padding: 12px; border: 1px solid #00ffea; border-radius: 10px; 
           background: #1c1c1c; color: #00ffd5; display: none; font-size: 0.95rem;">
  </div>   
</div>
<div id="imageMode" style="display:none; text-align:center;">
    <input type="file" id="imageUpload" accept="image/*" style="margin-bottom:15px;">
    <button id="processImageBtn" style="background-color:#00ffea; color:#121212;">📷 Extract & Translate</button>
    <img id="previewImage" style="max-width:100%; display:none; border-radius:10px; margin-top:10px;">
  
    <div class="box-container" style="margin-top:20px;">
      <label>Extracted Text</label>
      <textarea id="ocrInputText" rows="6" placeholder="Extracted text appears here..."></textarea>
    </div>

  
    <div class="box-container">
      <label>Translation</label>
      <textarea id="ocrOutputText" rows="6" readonly placeholder="Translation appears here..."></textarea>
    </div>
  
    <div style="margin-top:15px;">
      <button id="copyOcrBtn" style="background-color:#00d9ff; color:#121212;">📋 Copy Output</button>
      <button id="clearOcrBtn" style="background-color:#ff1744; color:#fff;">🧹 Clear All</button>
    </div>
  
    <div id="wave" style="display:none; justify-content:center; margin-top:10px;">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<script>
const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const translateBtn = document.getElementById("translateBtn");
const swapBtn = document.getElementById("swapBtn");
const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");
const voiceSelect = document.getElementById("voiceSelect");
const speakBtn = document.getElementById("speakBtn");
const wave = document.getElementById("wave");
const direction = document.getElementById("direction");
const inputLabel = document.getElementById("inputLabel");
const outputLabel = document.getElementById("outputLabel");
const charCounter = document.getElementById("charCounter");

const defineBtn = document.getElementById("defineBtn");
const definitionBox = document.getElementById("definitionBox");

const modeSelect = document.getElementById("modeSelect");
const textMode = document.getElementById("textMode");
const imageMode = document.getElementById("imageMode");

const imageUpload = document.getElementById("imageUpload");
const processImageBtn = document.getElementById("processImageBtn");
const ocrInputText = document.getElementById("ocrInputText");
const ocrOutputText = document.getElementById("ocrOutputText");
const copyOcrBtn = document.getElementById("copyOcrBtn");
const clearOcrBtn = document.getElementById("clearOcrBtn");

let voices = [];
let currentUtterance = null;

// --- Character counter & enable translate ---
inputText.addEventListener("input", () => {
    translateBtn.disabled = inputText.value.trim() === "";
    charCounter.textContent = `${inputText.value.length} characters`;
    updateControlsVisibility();
});

// --- Swap button ---
swapBtn.addEventListener("click", () => {
    const tempText = inputText.value;
    inputText.value = outputText.value;
    outputText.value = tempText;
    direction.value = direction.value === "en-tl" ? "tl-en" : "en-tl";
    updateLabels();
    translateBtn.disabled = inputText.value.trim() === "";
    charCounter.textContent = `${inputText.value.length} characters`;
    updateControlsVisibility();
});

// --- Copy output ---
copyBtn.addEventListener("click", () => {
    if(outputText.value){
        navigator.clipboard.writeText(outputText.value);
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "✅ Copied!";
        copyBtn.disabled = true;
        setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.disabled = false;
        }, 1500);
    }
});

// --- Clear all ---
clearBtn.addEventListener("click", () => {
    inputText.value = "";
    outputText.value = "";
    translateBtn.disabled = true;
    charCounter.textContent = "0 characters";
    updateControlsVisibility();
});

// --- Update labels ---
function updateLabels() {
    if(direction.value === "en-tl"){
        inputLabel.textContent = "English";
        outputLabel.textContent = "Tagalog";
    } else {
        inputLabel.textContent = "Tagalog";
        outputLabel.textContent = "English";
    }
}

// --- Update controls visibility ---
function updateControlsVisibility() {
    const hasOutput = outputText.value.trim().length > 0;
    const hasInput = inputText.value.trim().length > 0;

    copyBtn.disabled = !hasOutput;
    speakBtn.style.display = hasOutput ? "inline-block" : "none";
    voiceSelect.style.display = hasOutput ? "inline-block" : "none";
    clearBtn.disabled = !(hasInput || hasOutput);
    defineBtn.disabled = !hasOutput;
    definitionBox.style.display = "none";

    if(!hasOutput) wave.style.display = "none";
    if(!hasOutput) speakBtn.textContent = "🔊 Speak";
}

// --- Fetch definition ---
defineBtn.addEventListener("click", async () => {
    const word = outputText.value.trim();
    if(!word) return;

    definitionBox.style.display = "block";
    definitionBox.textContent = "📖 Searching definition...";

    try {
        const response = await fetch(`https://translator-backend-sxbp.onrender.com/define?word=${encodeURIComponent(word)}`);
        const data = await response.json();
        definitionBox.textContent = data.definition || "No definition found.";
    } catch (err) {
        console.error(err);
        definitionBox.textContent = "❌ Error fetching definition.";
    }
});

// --- Load voices ---
function loadVoices() {
    voices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = "";
    const filteredVoices = voices.filter(v => v.lang.startsWith("en") || v.lang.startsWith("fil") || v.lang.startsWith("tl"));
    filteredVoices.forEach(voice => {
        const option = document.createElement("option");
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });
}
window.speechSynthesis.onvoiceschanged = loadVoices;

// --- Translate function (NEW backend) ---
async function translateText() {
    const text = inputText.value.trim();
    outputText.value = "Translating...";
    speakBtn.style.display = wave.style.display = voiceSelect.style.display = "none";
    if (!text) return;

    try {
        const response = await fetch("https://translator-backend-sxbp.onrender.com/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, direction: direction.value })
        });
        const data = await response.json();
        outputText.value = data.translation || data.error || "❌ No response.";
        updateControlsVisibility();
    } catch (e) {
        outputText.value = "❌ Error connecting to server.";
    }
}

// --- Speak/Stop toggle ---
speakBtn.addEventListener("click", () => {
    if(currentUtterance){
        stopSpeaking();
    } else {
        const text = outputText.value;
        const dir = direction.value;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = dir === "en-tl" ? "fil-PH" : "en-US";
        const selectedVoice = voiceSelect.value;
        if(selectedVoice){
            const voice = voices.find(v => v.name === selectedVoice);
            if(voice) utterance.voice = voice;
        }
        currentUtterance = utterance;
        wave.style.display = "flex";
        speakBtn.textContent = "⏹ Stop";

        utterance.onend = () => {
            currentUtterance = null;
            wave.style.display = "none";
            speakBtn.textContent = "🔊 Speak";
        };

        speechSynthesis.speak(utterance);
    }
});
function stopSpeaking(){
    speechSynthesis.cancel();
    currentUtterance = null;
    wave.style.display = "none";
    speakBtn.textContent = "🔊 Speak";
}

// --- Connect translate button ---
translateBtn.addEventListener("click", translateText);
updateLabels();
updateControlsVisibility();

// --- Mode select ---
modeSelect.addEventListener("change", () => {
    if(modeSelect.value === "image"){
        textMode.style.display = "none";
        imageMode.style.display = "block";
    } else {
        textMode.style.display = "block";
        imageMode.style.display = "none";
    }
});

// --- OCR + Translation (NEW backend) ---
processImageBtn.addEventListener("click", async () => {
    if(!imageUpload.files.length) return alert("Please select an image first!");
    const file = imageUpload.files[0];
    ocrOutputText.value = "🔍 Extracting text...";
    wave.style.display = "flex";
    copyOcrBtn.disabled = true;
    clearOcrBtn.disabled = true;

    try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng+fil');
        ocrInputText.value = text.trim();
        ocrOutputText.value = "Translating...";

        const response = await fetch("https://translator-backend-sxbp.onrender.com/translate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ text: text.trim(), direction: "en-tl" })
        });
        const data = await response.json();
        ocrOutputText.value = data.translation || "❌ Translation failed.";
    } catch(err){
        console.error(err);
        ocrOutputText.value = "❌ OCR failed. Try clearer image.";
    } finally {
        wave.style.display = "none";
        copyOcrBtn.disabled = false;
        clearOcrBtn.disabled = false;
    }
});

// --- OCR buttons ---
function updateImageModeButtons() {
    const hasOcrInput = ocrInputText.value.trim().length > 0;
    const hasOcrOutput = ocrOutputText.value.trim().length > 0;
    copyOcrBtn.disabled = !hasOcrOutput;
    clearOcrBtn.disabled = !(hasOcrInput || hasOcrOutput);
}
ocrInputText.addEventListener("input", updateImageModeButtons);
ocrOutputText.addEventListener("input", updateImageModeButtons);

copyOcrBtn.addEventListener("click", () => {
    if (ocrOutputText.value.trim()) {
        navigator.clipboard.writeText(ocrOutputText.value);
        const original = copyOcrBtn.textContent;
        copyOcrBtn.textContent = "✅ Copied!";
        copyOcrBtn.disabled = true;
        setTimeout(() => {
            copyOcrBtn.textContent = original;
            updateImageModeButtons();
        }, 1500);
    }
});

clearOcrBtn.addEventListener("click", () => {
    ocrInputText.value = "";
    ocrOutputText.value = "";
    imageUpload.value = "";
    const preview = document.getElementById("previewImage");
    if (preview) {
        preview.src = "";
        preview.style.display = "none";
    }
    updateImageModeButtons();
});

// --- Initialize ---
updateImageModeButtons();
</script>
</body>
</html>
